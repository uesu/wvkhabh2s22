# Dependabot — routine vs review-required grouping, supported compiled-input regeneration.
# Routine updates grouped separately from major/review-required updates.
# No Actions-lockfile integration (maintainer deferred preview feature).
# To DISABLE completely: delete this file. The monitor is unaffected.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # requirements.txt is a GENERATED frozen graph (pip-tools with hashes). Dependabot
    # regenerates it from requirements.in via the supported compiled input; routine
    # patch/minor within approved major are auto-eligible, major/prerelease/ambiguous/0.x minor are review-required.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"
    groups:
      python-routine:
        patterns: ["*"]
        # Routine: allowlisted stable patch/minor within approved major — filtered by merge controller, not here.
        # Dependabot grouping excludes majors via update-types.
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      python-review-required:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      actions-review-required:
        patterns: ["*"]
        update-types: ["version-update:semver-major"]
