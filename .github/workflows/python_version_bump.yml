name: Python version bump (auto)

# Thin runtime proposer — selection/validation/publisher stages only.
# No self-merge; no doc rewrites; reads exact pin from .python-version.
# Weekly schedule + manual dispatch preserved, cancel-in-progress false.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Bump to this exact version instead of auto-detecting (optional)'
        required: false
        default: ''
      ignore_soak:
        description: 'Skip the soak period for a new minor series'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
      current: ${{ steps.resolve.outputs.current }}
      latest: ${{ steps.resolve.outputs.latest }}
      kind: ${{ steps.resolve.outputs.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python (current pin)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install validation toolchain (both frozen graphs plus mandatory linters)
        run: |
          set -euo pipefail
          # The candidate job runs the SAME registry as ordinary CI, so it needs the same
          # toolchain: both hashed graphs, the pinned compiler and the real mandatory linters.
          # Installing only the runtime graph left actionlint/zizmor missing, which the registry
          # treats as a blocking failure in CI rather than a skip.
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pip install zizmor==1.12.1
          version=1.7.7
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -fsSL -o /tmp/actionlint_checksums.txt "${base}/actionlint_${version}_checksums.txt"
          ( cd /tmp && grep -F "${archive}" actionlint_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
          zizmor --version

      - name: Validate the current baseline under its exact pin
        run: |
          set -euo pipefail
          # The baseline must be green under the pin that is actually checked out, before any
          # candidate is considered. Running the registry against a candidate interpreter while
          # .python-version still names the old pin can only report NOT VALIDATED.
          python -c 'import pathlib, platform; pin = pathlib.Path(".python-version").read_text().strip(); assert platform.python_version() == pin, f"running {platform.python_version()} != pinned {pin}"'
          python -m pip --version
          pip-compile --version
          python -u .github/scripts/ci.py --profile production

      - name: Resolve candidate version
        id: resolve
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          IGNORE_SOAK: ${{ inputs.ignore_soak }}
          SOAK_DAYS: ${{ vars.PYTHON_BUMP_SOAK_DAYS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d ' \r\n' < .python-version)"
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read current pin from .python-version"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $CURRENT"
          if [ -n "${FORCE_VERSION:-}" ]; then
            echo "Manual override requested: $FORCE_VERSION"
            # Validate syntax via helper
            python -c "import sys; sys.path.insert(0, '.github/scripts'); import maintenance; assert maintenance.parse_version('${FORCE_VERSION}') is not None, 'invalid forced version'"
            {
              echo "latest=${FORCE_VERSION}"
              echo "kind=forced"
              echo "bump=yes"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fetch versions-manifest via GitHub API (raw.githubusercontent.com not allowlisted, use api.github.com)
          if ! curl -fsSL -o manifest.json https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json 2>/dev/null; then
            echo "raw fetch failed, trying api.github.com"
            curl -fsSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o manifest.json https://api.github.com/repos/actions/python-versions/contents/versions-manifest.json || {
              echo "::error::Could not fetch versions-manifest via api.github.com"
              exit 1
            }
          fi
          python .github/scripts/python_version_bump.py --manifest manifest.json --current "$CURRENT" --check || true
          # python_version_bump.py writes bump/latest/kind to GITHUB_OUTPUT; ensure defaults
          if ! grep -q "bump=" "$GITHUB_OUTPUT" 2>/dev/null; then
            echo "bump=no" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Set up candidate interpreter
        if: steps.resolve.outputs.bump == 'yes'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version: ${{ steps.resolve.outputs.latest }}

      - name: Validate the candidate proposal bytes in an isolated workspace
        if: steps.resolve.outputs.bump == 'yes'
        env:
          CANDIDATE: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          # The candidate is validated as the exact bytes that will be published, in an isolated
          # copy of the repository: pin rewritten, policy reconciled narrowly, both lock graphs
          # regenerated under the real candidate interpreter with the registry's own seeded
          # relative-output commands, both hashed graphs installed, and the COMPLETE registry run
          # against the proposal. There is no reduced candidate-only validation path, and the
          # baseline workspace above is never modified.
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys

          sys.path.insert(0, ".github/scripts")
          import maintenance
          import python_version_bump as proposer

          candidate = os.environ["CANDIDATE"].strip()
          source = pathlib.Path(".").resolve()
          work = pathlib.Path("/tmp/candidate-proposal")

          actual = subprocess.run(
              [sys.executable, "-c",
               'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")'],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          if actual != candidate:
              print(f"::error::candidate interpreter is {actual}, expected {candidate}")
              raise SystemExit(1)

          # Bootstrap the pinned compiler INSIDE the freshly selected interpreter BEFORE the first
          # compile call. A new interpreter does not inherit the previous one's site-packages, so
          # the toolchain installed under the current pin is not available here, and the previous
          # interpreter's pip-compile executable must not be used either: the resolution and the
          # lock header have to come from the candidate itself.
          subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade",
                          f"pip=={maintenance.PINNED_PIP}"], check=True)
          subprocess.run([sys.executable, "-m", "pip", "install",
                          f"pip-tools=={maintenance.PINNED_PIP_TOOLS}"], check=True)

          # Verify the bootstrap interpreter-bound: the versions have to be the pinned ones and
          # the compiler module has to live inside this interpreter's own prefix, not an inherited
          # site-packages directory.
          probe = subprocess.run(
              [sys.executable, "-c",
               "import importlib.metadata as md, pathlib, sys, piptools;"
               "print(md.version('pip'));"
               "print(md.version('pip-tools'));"
               "print(pathlib.Path(piptools.__file__).resolve());"
               "print(pathlib.Path(sys.prefix).resolve())"],
              capture_output=True, text=True, timeout=120,
          )
          if probe.returncode != 0:
              print(f"::error::the candidate interpreter has no working pinned compiler: "
                    f"{(probe.stderr or probe.stdout or '').strip()[-800:]}")
              raise SystemExit(1)
          boot_pip, boot_tools, module_path, prefix = probe.stdout.split()
          if boot_pip != maintenance.PINNED_PIP or boot_tools != maintenance.PINNED_PIP_TOOLS:
              print(f"::error::candidate bootstrap produced pip {boot_pip} / pip-tools {boot_tools}, "
                    f"expected {maintenance.PINNED_PIP} / {maintenance.PINNED_PIP_TOOLS}")
              raise SystemExit(1)
          if not module_path.startswith(prefix):
              print(f"::error::candidate compiler at {module_path} is inherited from outside "
                    f"the candidate prefix {prefix}")
              raise SystemExit(1)
          print(f"bootstrapped pip {boot_pip} / pip-tools {boot_tools} inside {prefix}")

          if work.exists():
              shutil.rmtree(work)
          shutil.copytree(source, work, ignore=shutil.ignore_patterns(".git", "__pycache__"))

          (work / ".python-version").write_text(candidate + "\n", encoding="utf-8")

          policy_path = work / ".github" / "maintenance.json"
          before = policy_path.read_text(encoding="utf-8")
          after = proposer.rewrite_policy_versions(before, candidate)
          if not proposer.policy_change_is_narrow(before, after, candidate):
              print("::error::policy reconciliation would change more than the two derived version fields")
              raise SystemExit(1)
          policy_path.write_text(after, encoding="utf-8")

          # Regenerate both graphs under the candidate, seeded with the locked resolution and
          # using the registry's exact relative-output commands.
          for src_name, lock in (("requirements.in", "requirements.txt"),
                                 ("requirements-dev.in", "requirements-dev.txt")):
              for seed in ("requirements.in", "requirements.txt", lock):
                  origin = source / seed
                  if origin.is_file() and not (work / seed).is_file():
                      shutil.copy2(origin, work / seed)
              result = subprocess.run(
                  [sys.executable, "-m", "piptools", "compile", "--generate-hashes",
                   "--allow-unsafe", "--resolver=backtracking", "--strip-extras",
                   f"--output-file={lock}", src_name],
                  cwd=work, capture_output=True, text=True, timeout=900,
              )
              if result.returncode != 0:
                  print(f"::error::regenerating {lock} under {candidate} failed: "
                        f"{(result.stderr or result.stdout or '')[-2000:]}")
                  raise SystemExit(1)
              print(f"regenerated {lock} under CPython {candidate}")

          # Install both hashed graphs into the candidate, then run the complete registry.
          subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade", "pip==26.1.1"], check=True)
          for lock in ("requirements.txt", "requirements-dev.txt"):
              subprocess.run([sys.executable, "-m", "pip", "install", "--require-hashes",
                              "--only-binary=:all:", "-r", str(work / lock)], check=True)
          registry = subprocess.run(
              [sys.executable, "-u", str(work / ".github" / "scripts" / "ci.py"),
               "--profile", "production"],
              cwd=work, timeout=1800,
          )
          if registry.returncode != 0:
              print(f"::error::the candidate proposal failed the registry (exit {registry.returncode})")
              raise SystemExit(1)

          # The recorded toolchain versions are the ones verified inside the candidate above.
          # Reading `pip-compile --version` from PATH would report the PREVIOUS interpreter's
          # compiler, which is precisely the confusion the bootstrap exists to prevent.
          record = proposer.build_validation_evidence(
              source_head=os.environ.get("GITHUB_SHA", ""),
              candidate=candidate,
              interpreter=actual,
              pip_version=boot_pip,
              pip_tools_version=boot_tools,
              digests=proposer.digest_files(work),
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
          )
          line = proposer.notice(proposer.VALIDATION_NOTICE, record)
          if line is None:
              print("::error::validation evidence exceeds the bounded notice size")
              raise SystemExit(1)
          print(line)

          # Stage exactly the allowlisted proposal files plus the evidence record in the flat tree
          # the publisher expects. Uploading several separate absolute paths would make the action
          # use their least common ancestor (/tmp) as the artifact root, nesting every file under
          # candidate-proposal/, and hidden files are excluded unless inclusion is requested.
          staged = proposer.stage_proposal_artifact(
              work, record, pathlib.Path("/tmp/proposal-artifact"))
          ok, reason, problems = proposer.verify_artifact_layout(
              pathlib.Path("/tmp/proposal-artifact"))
          if not ok:
              print(f"::error::staged proposal artifact is incomplete: {reason}")
              raise SystemExit(1)
          for name in sorted(staged):
              print(f"staged {name} sha256={staged[name][:16]}")
          print(f"candidate proposal validated; {reason}")
          PY

      - name: Upload the exact validated proposal bytes
        if: steps.resolve.outputs.bump == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4 — SHA-pinned
        with:
          name: python-bump-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          # One staged tree, so the artifact root is that directory's contents and the publisher
          # finds every file at the relative path it expects. Hidden inclusion is required because
          # .python-version and .github/maintenance.json are dotfiles, which the action ignores by
          # default. Only the allowlisted staged tree is uploaded — never the checkout or .git.
          path: /tmp/proposal-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Summary (selection)
        if: always()
        run: |
          {
            echo "### Python version bump — selection"
            echo ""
            echo "* current pin: \`${{ steps.resolve.outputs.current || 'unknown' }}\`"
            echo "* candidate: \`${{ steps.resolve.outputs.latest || 'none' }}\` (${{ steps.resolve.outputs.kind || 'n/a' }})"
            echo "* bump: \`${{ steps.resolve.outputs.bump || 'no' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: select-and-validate
    if: needs.select-and-validate.outputs.bump == 'yes'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository (publisher, with BUMP_PAT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          token: ${{ secrets.BUMP_PAT }}

      - name: Verify BUMP_PAT is configured
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          if [ -z "${BUMP_PAT:-}" ]; then
            echo "::error::BUMP_PAT secret is not configured — publisher cannot create PR (explicit configuration error)"
            exit 1
          fi
          echo "Publisher token present (value redacted)"

      - name: Download the exact validated proposal bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 — SHA-pinned
        with:
          name: python-bump-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/validated-proposal
          if-no-files-found: error

      - name: Publish only the validated bytes (no candidate execution here)
        env:
          CURRENT: ${{ needs.select-and-validate.outputs.current }}
          LATEST: ${{ needs.select-and-validate.outputs.latest }}
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          COMMIT_NAME: ${{ vars.PYTHON_BUMP_COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.PYTHON_BUMP_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          # The credentialed publisher never compiles or installs the proposed dependencies; it
          # republishes the bytes the read-only candidate job already validated, after verifying
          # their digests, then records what it published so the controller can identify the run
          # and attempt that produced this exact proposal head.
          python - <<'PY'
          import json, os, pathlib, subprocess, sys

          sys.path.insert(0, ".github/scripts")
          import maintenance, python_version_bump as proposer

          latest = os.environ["LATEST"].strip()
          current = os.environ["CURRENT"].strip()
          validated = pathlib.Path("/tmp/validated-proposal")
          layout_ok, layout_reason, _missing = proposer.verify_artifact_layout(validated)
          if not layout_ok:
              print(f"::error::{layout_reason} — refusing to publish a partial proposal")
              raise SystemExit(1)
          print(f"downloaded proposal artifact: {layout_reason}")
          record = json.loads((validated / "proposal-validation.json").read_text(encoding="utf-8"))

          if record.get("candidate_version") != latest:
              print(f"::error::validated candidate {record.get('candidate_version')} is not {latest}")
              raise SystemExit(1)
          if record.get("interpreter") != latest:
              print(f"::error::validation was not performed by the candidate interpreter")
              raise SystemExit(1)
          if record.get("source_head") and record["source_head"] != os.environ.get("GITHUB_SHA", ""):
              print(f"::error::validated source head {record['source_head']} is not the current checkout "
                    f"{os.environ.get('GITHUB_SHA', '')} — revalidate before publishing")
              raise SystemExit(1)

          # Publish the exact validated bytes; nothing is regenerated in this job.
          for name in proposer.PROPOSAL_FILES:
              src, dst = validated / name, pathlib.Path(name)
              if not src.is_file():
                  print(f"::error::validated proposal is missing {name}")
                  raise SystemExit(1)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())

          published = proposer.digest_files(pathlib.Path("."))
          ok, reason = proposer.verify_validated_bytes(
              record, published,
              candidate=latest,
              pinned_pip=maintenance.PINNED_PIP,
              pinned_pip_tools=maintenance.PINNED_PIP_TOOLS,
          )
          if not ok:
              print(f"::error::published bytes do not match the validated proposal: {reason}")
              raise SystemExit(1)
          print(f"published bytes match the validated proposal ({reason})")

          # Trusted policy, not PR content, decides which files a routine bump may touch.
          policy = maintenance.load_maintenance_profile()
          allowed = [".python-version", "requirements.txt", "requirements-dev.txt"]
          python_policy = policy.get("python") or {}
          generated_policy = python_policy.get("policy_file")
          commit_identity = python_policy.get("commit_identity")
          if generated_policy:
              allowed.append(generated_policy)
          changed = [c.strip() for c in subprocess.check_output(
              ["git", "diff", "--name-only"], text=True).splitlines() if c.strip()]
          if not changed:
              print("::notice::proposal is byte-identical to the base — nothing to publish")
              raise SystemExit(0)
          result = maintenance.validate_changed_files(changed, allowed=allowed)
          if not result["ok"]:
              print(f"::error::{result['reason']}")
              raise SystemExit(1)
          if generated_policy in changed:
              before = subprocess.check_output(
                  ["git", "show", f"HEAD:{generated_policy}"], text=True)
              after = pathlib.Path(generated_policy).read_text(encoding="utf-8")
              if not proposer.policy_change_is_narrow(before, after, latest):
                  print(f"::error::{generated_policy} changed beyond the two derived version fields")
                  raise SystemExit(1)
          actual_commit = subprocess.check_output(
              ["git", "log", "-1", "--format=%an"], text=True).strip()
          if commit_identity and actual_commit != commit_identity:
              print(f"::error::commit identity {actual_commit!r} is not the configured bot "
                    f"{commit_identity!r}")
              raise SystemExit(1)
          print(f"changed files accepted: {changed}")
          PY

          BRANCH="chore/python-${LATEST}"
          # The commit identity is a configured bot; it is deliberately NOT the run actor and NOT
          # necessarily the PR author. Each identity is recorded separately in the publication
          # evidence rather than being forced to be one login.
          git config user.name "${COMMIT_NAME:-github-actions[bot]}"
          git config user.email "${COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git checkout -b "$BRANCH"
          git add .python-version requirements.txt requirements-dev.txt .github/maintenance.json
          git commit -m "chore: bump CPython pin ${CURRENT} -> ${LATEST}"
          git push --force-with-lease origin "$BRANCH"

          PR_BODY="Automated Python bump ${CURRENT} -> ${LATEST}, validated in an isolated candidate workspace under the candidate interpreter (both hashed graphs installed, full registry green). No self-merge; the maintenance controller decides."
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore: bump CPython pin ${CURRENT} -> ${LATEST}" --body "$PR_BODY" >/dev/null
          else
            gh pr create --base main --head "$BRANCH" --title "chore: bump CPython pin ${CURRENT} -> ${LATEST}" --body "$PR_BODY"
          fi

          python - <<'PY'
          import json, os, pathlib, subprocess, sys

          sys.path.insert(0, ".github/scripts")
          import python_version_bump as proposer

          latest = os.environ["LATEST"].strip()
          branch = f"chore/python-{latest}"
          number = int(subprocess.check_output(
              ["gh", "pr", "view", branch, "--json", "number", "--jq", ".number"], text=True).strip())
          head = subprocess.check_output(
              ["gh", "pr", "view", branch, "--json", "headRefOid", "--jq", ".headRefOid"],
              text=True).strip()
          author = subprocess.check_output(
              ["gh", "pr", "view", branch, "--json", "author", "--jq", ".author.login"],
              text=True).strip()
          commit_name = subprocess.check_output(
              ["git", "log", "-1", "--format=%an"], text=True).strip()
          record = proposer.build_publication_evidence(
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              pull_number=number,
              published_head=head,
              branch=branch,
              digests=proposer.digest_files(pathlib.Path(".")),
              pr_author=author,
              commit_identity=commit_name,
              run_actor=os.environ.get("GITHUB_ACTOR") or None,
          )
          line = proposer.notice(proposer.PUBLICATION_NOTICE, record)
          if line is None:
              print("::error::publication evidence exceeds the bounded notice size")
              raise SystemExit(1)
          print(line)
          print(f"published PR #{number} at {head[:12]} as author {author} committed by {commit_name}")
          PY

      - name: Report published
        if: always()
        run: |
          {
            echo "### Python version bump — published"
            echo "* current: \`${{ needs.select-and-validate.outputs.current }}\`"
            echo "* candidate: \`${{ needs.select-and-validate.outputs.latest }}\`"
            echo "* branch: \`chore/python-${{ needs.select-and-validate.outputs.latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
