name: Python version bump (auto)

# Thin runtime proposer — selection/validation/publisher stages only.
# No self-merge; no doc rewrites; reads exact pin from .python-version.
# Weekly schedule + manual dispatch preserved, cancel-in-progress false.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Bump to this exact version instead of auto-detecting (optional)'
        required: false
        default: ''
      ignore_soak:
        description: 'Skip the soak period for a new minor series'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
      current: ${{ steps.resolve.outputs.current }}
      latest: ${{ steps.resolve.outputs.latest }}
      kind: ${{ steps.resolve.outputs.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python (current pin)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install helper dependencies (frozen, hash-verified)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Resolve candidate version
        id: resolve
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          IGNORE_SOAK: ${{ inputs.ignore_soak }}
          SOAK_DAYS: ${{ vars.PYTHON_BUMP_SOAK_DAYS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d ' \r\n' < .python-version)"
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read current pin from .python-version"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $CURRENT"
          if [ -n "${FORCE_VERSION:-}" ]; then
            echo "Manual override requested: $FORCE_VERSION"
            # Validate syntax via helper
            python -c "import sys; sys.path.insert(0, '.github/scripts'); import maintenance; assert maintenance.parse_version('${FORCE_VERSION}') is not None, 'invalid forced version'"
            {
              echo "latest=${FORCE_VERSION}"
              echo "kind=forced"
              echo "bump=yes"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fetch versions-manifest via GitHub API (raw.githubusercontent.com not allowlisted, use api.github.com)
          if ! curl -fsSL -o manifest.json https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json 2>/dev/null; then
            echo "raw fetch failed, trying api.github.com"
            curl -fsSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3.raw" -o manifest.json https://api.github.com/repos/actions/python-versions/contents/versions-manifest.json || {
              echo "::error::Could not fetch versions-manifest via api.github.com"
              exit 1
            }
          fi
          python .github/scripts/python_version_bump.py --manifest manifest.json --current "$CURRENT" --check || true
          # python_version_bump.py writes bump/latest/kind to GITHUB_OUTPUT; ensure defaults
          if ! grep -q "bump=" "$GITHUB_OUTPUT" 2>/dev/null; then
            echo "bump=no" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Set up candidate interpreter
        if: steps.resolve.outputs.bump == 'yes'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version: ${{ steps.resolve.outputs.latest }}

      - name: Verify candidate — wheels exist and CI passes
        if: steps.resolve.outputs.bump == 'yes'
        run: |
          set -euo pipefail
          python --version
          CANDIDATE="${{ steps.resolve.outputs.latest }}"
          ACTUAL="$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')"
          if [ "$ACTUAL" != "$CANDIDATE" ]; then
            echo "::error::Interpreter mismatch: expected $CANDIDATE got $ACTUAL"
            exit 1
          fi
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m compileall -q "testing area" tests .github/scripts
          python .github/scripts/ci.py --profile production

      - name: Summary (selection)
        if: always()
        run: |
          {
            echo "### Python version bump — selection"
            echo ""
            echo "* current pin: \`${{ steps.resolve.outputs.current || 'unknown' }}\`"
            echo "* candidate: \`${{ steps.resolve.outputs.latest || 'none' }}\` (${{ steps.resolve.outputs.kind || 'n/a' }})"
            echo "* bump: \`${{ steps.resolve.outputs.bump || 'no' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: select-and-validate
    if: needs.select-and-validate.outputs.bump == 'yes'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository (publisher, with BUMP_PAT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          token: ${{ secrets.BUMP_PAT }}

      - name: Verify BUMP_PAT is configured
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          if [ -z "${BUMP_PAT:-}" ]; then
            echo "::error::BUMP_PAT secret is not configured — publisher cannot create PR (explicit configuration error)"
            exit 1
          fi
          echo "Publisher token present (value redacted)"

      - name: Create deterministic proposal (publisher updates runtime pin consistently)
        env:
          CURRENT: ${{ needs.select-and-validate.outputs.current }}
          LATEST: ${{ needs.select-and-validate.outputs.latest }}
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${LATEST:-}" ] || [ -z "${CURRENT:-}" ]; then
            echo "No candidate to publish"
            exit 0
          fi
          # Validate current pin still present (production without docs must work; docs are not required)
          if ! grep -Fq "$CURRENT" .python-version; then
            echo "::error::.python-version does not contain expected current pin $CURRENT"
            exit 1
          fi
          echo "$LATEST" > .python-version
          # Keep runtime profile consistent: maintenance.json current_version and supported_versions must match the pin
          python - <<'PY'
          import json, pathlib, os
          latest = os.environ["LATEST"]
          p = pathlib.Path(".github/maintenance.json")
          if p.is_file():
              data = json.loads(p.read_text())
              if "python" in data:
                  data["python"]["current_version"] = latest
                  data["python"]["supported_versions"] = [latest]
                  p.write_text(json.dumps(data, indent=2) + "\n")
                  print(f"Updated maintenance.json to {latest}")
          PY
          if git diff --quiet; then
            echo "No changes to publish (empty diff — already up-to-date)"
            exit 0
          fi
          # Structural diff validation via shared helper — fails closed if disallowed files would change
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".github/scripts")
          import maintenance
          changed = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          changed = [c.strip() for c in changed if c.strip()]
          print(f"Changed files: {changed}")
          result = maintenance.validate_changed_files(changed)
          print(result)
          if not result["ok"]:
              print(f"::error::{result['reason']}", file=sys.stderr)
              sys.exit(1)
          # Also validate workflow contents: triggers/permissions/run changes require human review
          # The helper will check workflow file diffs for structural changes beyond version pin
          import pathlib
          for f in changed:
              if f.startswith(".github/workflows/"):
                  text = pathlib.Path(f).read_text(errors="ignore")
                  # Hard-coded version literals (other than .python-version) should be avoided; proposer updates via file
                  if "python-version:" in text and ".python-version" not in text:
                      print(f"WARNING: {f} uses literal python-version; prefer python-version-file")
          PY
          BRANCH="chore/python-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .python-version .github/maintenance.json
          git commit -m "chore: bump CPython pin ${CURRENT} -> ${LATEST}"
          git push --force-with-lease origin "$BRANCH"
          # Publish/update one deterministic PR; never execute candidate dependencies with write credentials
          PR_BODY="Automated Python bump ${CURRENT} -> ${LATEST}. Validation passed under candidate interpreter (frozen hash install, CI gates). No self-merge; maintenance controller will decide."
          # Use gh to create or update PR — PR author will be BUMP_PAT owner, not github-actions[bot]; controller checks branch/title, not author
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists — updating"
            gh pr edit "$BRANCH" --title "chore: bump CPython pin ${CURRENT} -> ${LATEST}" --body "$PR_BODY" || true
          else
            gh pr create --base main --head "$BRANCH" --title "chore: bump CPython pin ${CURRENT} -> ${LATEST}" --body "$PR_BODY"
          fi
          echo "Published PR for $LATEST"

      - name: Report published
        if: always()
        run: |
          {
            echo "### Python version bump — published"
            echo "* current: \`${{ needs.select-and-validate.outputs.current }}\`"
            echo "* candidate: \`${{ needs.select-and-validate.outputs.latest }}\`"
            echo "* branch: \`chore/python-${{ needs.select-and-validate.outputs.latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
