name: CI — syntax + offline validation

# Safety gate for Dependabot PRs (and any PR): proves the monitor scripts
# still install and compile after a dependency or runtime bump BEFORE anything
# can be merged to main. Runs on every PR + push to main.
# This file is SHA-pinned, least-privilege, and uses frozen hashed installs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Core validation — reads exact pin from .python-version, installs frozen
  # graph with hash verification, runs the common CI adapter.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python (exact pin via .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # python-version: '3.14.8' via .python-version — exact pin (smoke r39 comment, proposer uses file)
      # python tests/test_reddit_signals.py python tests/test_twitter_media.py via ci.py registry — pure signal suite (r42)
      - name: Install dependencies (frozen, hash-verified, wheels only)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Compile every .py file (syntax errors fail here)
        run: |
          python -m compileall -q "testing area" tests .github/scripts

      - name: Install actionlint (immutable release, checksum-verified)
        run: |
          set -euo pipefail
          version=1.7.7
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -fsSL -o /tmp/actionlint_checksums.txt "${base}/actionlint_${version}_checksums.txt"
          # Verify the downloaded bytes against the SHA-256 checksums upstream published for this
          # immutable release. A mismatch fails the job; there is no fallthrough or "skipped" path.
          ( cd /tmp && grep -F "${archive}" actionlint_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version > /tmp/actionlint-version.txt 2>&1
          cat /tmp/actionlint-version.txt
          grep -qF "${version}" /tmp/actionlint-version.txt

      - name: Install zizmor (pinned, for mandatory workflow-lint)
        run: |
          python -m pip install zizmor==1.12.1
          zizmor --version

      - name: Run CI adapter — both mandatory profiles
        run: |
          set +e
          # Both profiles run the same mandatory registry; each is executed here so the
          # production profile is demonstrated in the pinned environment too, not assumed
          # from the development result. tee, not redirection: the registry publishes its
          # own annotations as workflow commands on stdout, which the runner only sees when
          # stdout is not captured. -u keeps stdout unbuffered so merged output stays in order.
          failed=0
          unvalidated=0
          for profile in development production; do
            echo "::group::CI adapter — ${profile} profile"
            python -u .github/scripts/ci.py --profile "${profile}" 2>&1 | tee "/tmp/ci-adapter-${profile}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "${rc}" -eq 1 ]; then
              failed=1
            elif [ "${rc}" -eq 2 ]; then
              unvalidated=1
            elif [ "${rc}" -ne 0 ]; then
              failed=1
            fi
          done
          if [ "${failed}" -eq 1 ]; then
            outcome=1
          elif [ "${unvalidated}" -eq 1 ]; then
            outcome=2
          else
            outcome=0
          fi
          if [ "${outcome}" -ne 0 ] && \
             ! grep -qh "^::error::" /tmp/ci-adapter-development.log /tmp/ci-adapter-production.log; then
            # Fallback only for a crash before the registry could report: never grep the logs for
            # ERROR strings, because the registered suites emit those as fixtures.
            tail -c 2400 /tmp/ci-adapter-production.log | tr '\n' '~' | sed 's/%/%25/g' > /tmp/ci-tail.txt
            split -b 800 /tmp/ci-tail.txt /tmp/ci-chunk-
            for _f in /tmp/ci-chunk-*; do
              echo "::error::ci-adapter crashed without reporting (rc=${outcome}): $(cat "$_f")"
            done
          fi
          exit "${outcome}"

      # ---------------------------------------------------------------------
      # TEMPORARY PR-only compiler bridge — removed in the final alignment commit.
      # Regenerates the aligned dev lock under the pinned interpreter using the
      # repository's own seeded compiler command, then publishes reviewable
      # evidence. Artifact blobs and job logs are not retrievable from the review
      # sandbox, so the genuine generated difference is also emitted as bounded
      # annotations. Read-only: it never writes the checkout, never pushes, and
      # dispatches no monitor, proposer or publisher.
      # ---------------------------------------------------------------------
      - name: Generate aligned lint lock candidate (temporary bridge)
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import difflib
          import gzip
          import hashlib
          import importlib.metadata
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          # BRIDGE_LOCAL_PREFLIGHT is never set on a runner: it exists only so the identical
          # shipped script can be rehearsed on a non-pinned interpreter, where the version
          # assertions and the byte-identity control are reported instead of enforced.
          preflight = os.getenv("BRIDGE_LOCAL_PREFLIGHT") == "1"
          root = Path.cwd()
          if not preflight:
              assert sys.version_info[:3] == (3, 14, 8), sys.version
              assert importlib.metadata.version("pip") == "26.1.1", importlib.metadata.version("pip")
              assert importlib.metadata.version("pip-tools") == "7.5.3", importlib.metadata.version("pip-tools")
              assert (root / ".python-version").read_text(encoding="utf-8").strip() == "3.14.8"
          policy = json.loads((root / ".github/maintenance.json").read_text(encoding="utf-8"))
          target_ruff = policy["lint_toolchain"]["version"]
          assert target_ruff == "0.17.1", policy["lint_toolchain"]
          committed_in = (root / "requirements-dev.in").read_text(encoding="utf-8")
          assert committed_in.splitlines().count("ruff==0.14.3") == 1, "expected exactly one 0.14.3 pin"
          committed_lock = (root / "requirements-dev.txt").read_bytes()

          sys.path.insert(0, str(root / ".github/scripts"))
          import ci


          def compile_once(workdir: Path) -> bytes:
              """One seeded regeneration through the repository's own compiler command."""
              run = ci._regenerate_lock("requirements-dev.txt", "requirements-dev.in", workdir)
              if run.returncode:
                  print(run.stdout)
                  print(run.stderr, file=sys.stderr)
                  raise SystemExit(f"dev lock regeneration failed (exit {run.returncode})")
              return (workdir / "requirements-dev.txt").read_bytes()


          def seeded() -> Path:
              workdir = Path(tempfile.mkdtemp(prefix="bridge-"))
              for name in ("requirements-dev.in", "requirements-dev.txt"):
                  shutil.copy2(root / name, workdir / name)
              return workdir


          # CONTROL: the unchanged input must reproduce the committed lock byte-for-byte here,
          # which proves this step sees the same interpreter, compiler and seeds as the gate.
          control_dir = seeded()
          control_identical = compile_once(control_dir) == committed_lock
          shutil.rmtree(control_dir, ignore_errors=True)
          if not preflight:
              assert control_identical, "control regeneration is not byte-identical to the committed lock"

          # CANDIDATE: the aligned input, compiled twice so idempotence is proven, not assumed.
          out = Path(os.environ["RUNNER_TEMP"]) / "lint-lock-candidate"
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          for name in ("requirements-dev.in", "requirements-dev.txt"):
              shutil.copy2(root / name, out / name)
          (out / "requirements-dev.in").write_text(
              committed_in.replace("ruff==0.14.3", f"ruff=={target_ruff}"), encoding="utf-8"
          )
          regenerated = compile_once(out)
          idempotent = compile_once(out) == regenerated
          assert idempotent, "non-idempotent lock"
          (out / "requirements-dev.txt").write_bytes(regenerated)

          dirty = subprocess.run(
              ["git", "status", "--porcelain", "--",
               "requirements.in", "requirements.txt", "requirements-dev.in", "requirements-dev.txt"],
              check=True, capture_output=True, text=True, cwd=root,
          ).stdout.strip()
          checkout_clean = dirty == ""
          assert checkout_clean, f"the bridge must never write the checkout: {dirty!r}"

          diff = list(difflib.unified_diff(
              committed_lock.decode(encoding="utf-8").splitlines(),
              regenerated.decode(encoding="utf-8").splitlines(),
              fromfile="committed/requirements-dev.txt",
              tofile="regenerated/requirements-dev.txt",
              lineterm="", n=1,
          ))
          removed = sum(1 for line in diff if line.startswith("-") and not line.startswith("---"))
          added = sum(1 for line in diff if line.startswith("+") and not line.startswith("+++"))
          digest = hashlib.sha256(regenerated).hexdigest()
          proof = {
              "purpose": "temporary PR-only compiler bridge; removed in the final alignment commit",
              "repository": os.environ.get("GITHUB_REPOSITORY", "local"),
              "pr_head_sha": os.environ.get("PR_HEAD_SHA", "local"),
              "checkout_sha": subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                                             capture_output=True, text=True, cwd=root).stdout.strip(),
              "run_id": os.environ.get("GITHUB_RUN_ID", "local"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "local"),
              "python": sys.version,
              "pip": importlib.metadata.version("pip"),
              "pip_tools": importlib.metadata.version("pip-tools"),
              "control_regeneration_byte_identical": control_identical,
              "compilations": 2,
              "idempotent": idempotent,
              "checkout_unmodified": checkout_clean,
              "committed_sha256": hashlib.sha256(committed_lock).hexdigest(),
              "regenerated_sha256": digest,
              "committed_lines": len(committed_lock.decode(encoding="utf-8").splitlines()),
              "regenerated_lines": len(regenerated.decode(encoding="utf-8").splitlines()),
              "diff_removed_lines": removed,
              "diff_added_lines": added,
              "runtime_input_sha256": hashlib.sha256((root / "requirements.in").read_bytes()).hexdigest(),
              "runtime_lock_sha256": hashlib.sha256((root / "requirements.txt").read_bytes()).hexdigest(),
          }
          (out / "proof.json").write_text(json.dumps(proof, indent=2) + "\n", encoding="utf-8")


          def notice(text: str) -> None:
              print("::notice::" + text.replace("%", "%25"))


          notice(
              "LINT-BRIDGE-PROOF "
              f"python={sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro} "
              f"pip={proof['pip']} pip-tools={proof['pip_tools']} "
              f"control_byte_identical={control_identical} compilations=2 idempotent={idempotent} "
              f"checkout_unmodified={checkout_clean} committed_sha256={proof['committed_sha256']} "
              f"regenerated_sha256={digest} committed_lines={proof['committed_lines']} "
              f"regenerated_lines={proof['regenerated_lines']} diff_removed={removed} diff_added={added} "
              f"runtime_in_sha256={proof['runtime_input_sha256'][:16]} "
              f"runtime_lock_sha256={proof['runtime_lock_sha256'][:16]} "
              f"pr_head_sha={proof['pr_head_sha']} checkout_sha={proof['checkout_sha']} "
              f"run={proof['run_id']}/{proof['run_attempt']}"
          )

          # The review sandbox cannot reach artifact blobs or job logs, so the genuine generated
          # difference is also published as bounded single-line annotations. gzip+base64 keeps it
          # to a few notices; the whole-file digest above proves any reconstruction is byte-exact.
          blob = base64.b64encode(gzip.compress("\n".join(diff).encode(encoding="utf-8"), 9)).decode()
          chunks = [blob[i:i + 700] for i in range(0, len(blob), 700)] or [""]
          assert len(chunks) <= 8, f"generated diff too large to publish: {len(chunks)} chunks"
          for index, chunk in enumerate(chunks, 1):
              notice(f"LINT-BRIDGE-DIFF {index}/{len(chunks)} sha256={digest[:16]} {chunk}")
          print(f"bridge complete: {len(chunks)} diff notice(s), regenerated {digest}")
          PY

      - name: Upload aligned lint lock artifact (temporary bridge)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7 — SHA-pinned
        with:
          name: lint-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lint-lock-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Debug lock on failure
        if: failure()
        run: |
          set +e
          echo "=== interpreter and pinned compiler ==="
          python -V
          pip --version
          pip-compile --version
          echo "=== committed lock headers ==="
          head -n 6 requirements.txt
          head -n 6 requirements-dev.txt
          echo "=== seeded regeneration: same directory layout, filenames and command as the registry ==="
          rm -rf /tmp/ci_debug
          mkdir -p /tmp/ci_debug
          cp requirements.in requirements.txt requirements-dev.in requirements-dev.txt /tmp/ci_debug/
          cp requirements.txt /tmp/ci_debug/committed-requirements.txt
          cp requirements-dev.txt /tmp/ci_debug/committed-requirements-dev.txt
          cd /tmp/ci_debug || exit 1
          python -m piptools compile --generate-hashes --allow-unsafe --resolver=backtracking --strip-extras --output-file=requirements.txt requirements.in 2>&1 | tail -n 10
          python -m piptools compile --generate-hashes --allow-unsafe --resolver=backtracking --strip-extras --output-file=requirements-dev.txt requirements-dev.in 2>&1 | tail -n 10
          echo "=== committed vs regenerated (identical filenames, no renaming artifacts) ==="
          diff -u committed-requirements.txt requirements.txt | head -n 200
          diff -u committed-requirements-dev.txt requirements-dev.txt | head -n 200

      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4 SHA-pinned
        with:
          name: ci-debug-${{ github.run_id }}
          path: /tmp/ci_debug/
          if-no-files-found: ignore

      - name: Bounded failure summary (read-only, redacted)
        if: failure()
        run: |
          set +e
          {
            echo "### CI validation failed"
            echo ""
            echo "- code SHA: \`${GITHUB_SHA}\`"
            echo "- interpreter: \`$(python -V 2>&1)\`"
            echo "- runtime lock digest: \`$(sha256sum requirements.txt | cut -d' ' -f1)\`"
            echo "- dev lock digest: \`$(sha256sum requirements-dev.txt | cut -d' ' -f1)\`"
            echo ""
            echo "Mandatory registry outcome (bounded):"
            echo ""
            echo '```'
            head -c 1500 /tmp/ci-failure.txt 2>/dev/null || echo "no /tmp/ci-failure.txt"
            echo '```'
            echo ""
            echo "Adapter failure lines (bounded):"
            echo ""
            echo '```'
            grep -hE "^(FAIL|NOT VALIDATED)" /tmp/ci-adapter-development.log /tmp/ci-adapter-production.log 2>/dev/null | head -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record interpreter, lock digest and runner image for summary
        if: always()
        run: |
          {
            echo "Python $(python -V 2>&1) on $(uname -a)"
            echo "Runtime lock digest: $(sha256sum requirements.txt | cut -d' ' -f1)"
            echo "Dev lock digest: $(sha256sum requirements-dev.txt | cut -d' ' -f1)"
            echo "Runner image: ${{ runner.os }} ${{ runner.arch }}"
            echo "Code SHA: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Why typing-extensions is not part of the 3.14 graph: the actual Requires-Dist
          # markers of the installed distributions, read under the pinned interpreter.
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          from importlib.metadata import PackageNotFoundError, requires

          print("typing-extensions requirements under this interpreter:")
          for package in ("aiohttp", "aiosignal", "multidict", "propcache", "yarl", "pip-tools"):
              try:
                  entries = requires(package) or []
              except PackageNotFoundError:
                  print(f"  {package}: not installed")
                  continue
              hits = [entry for entry in entries if "typing" in entry.lower()]
              print(f"  {package}: {hits if hits else 'no typing-extensions requirement'}")
          PY

  # ---------------------------------------------------------------------------
  # Advisory checks — never block merge, but visible to merge controller as
  # explicitly advisory (pip-audit, actionlint, zizmor, ruff).
  # ---------------------------------------------------------------------------
  advisory-checks:
    name: Advisory checks (never block a merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # ruff is deliberately NOT pip-installed here: astral-sh/ruff-action downloads and runs its
      # own ruff binary and never uses the job's site-packages, so a pip pin in this lane only
      # implied a rule set the lane did not actually apply. The version that really runs is pinned
      # on the action below.
      - name: Install pinned pip for the advisory lane
        run: |
          python -m pip install --upgrade pip==26.1.1

      - name: Known-vulnerability scan of requirements.txt (pip-audit)
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0 — SHA-pinned
        with:
          inputs: requirements.txt

      - name: Static check of workflow YAML itself (rhysd/actionlint via reviewdog)
        continue-on-error: true
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974  # v1.80.0 — SHA-pinned
        with:
          reporter: local
          fail_level: none

      - name: Security review of workflow YAML (zizmor)
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4 — SHA-pinned
        with:
          inputs: .github/workflows
          advanced-security: false
          persona: regular

      - name: Lint Python helpers/tests (ruff, reading repo's own ruff.toml if present)
        continue-on-error: true
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0 — SHA-pinned
        with:
          # Pinned explicitly because the action resolves an unversioned request to "latest": ruff
          # 0.17.x widened ruff's DEFAULT rule selection from ~40 rules to 407, so the same commit
          # reported a different finding set depending on the day it ran. This pins forward to the
          # version that is already in effect, keeping every current finding visible; pinning back
          # to the 0.14.3 default selection would hide them. The declared dev-lock pin
          # (ruff==0.14.3 in requirements-dev.txt) and this effective version are a known, reported
          # divergence that needs a maintainer decision, not a silent one here.
          version: "0.17.1"
          args: check --output-format=github  # ruff.toml picked up automatically

  # ---------------------------------------------------------------------------
  # Stable final mandatory gate — aggregates all mandatory checks without
  # depending on the merge controller itself. No circular dependency.
  # Uses always() but succeeds only when each mandatory dependency actually succeeded.
  # ---------------------------------------------------------------------------
  maintenance-ci:
    name: maintenance-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: always()
    steps:
      - name: Aggregate mandatory checks
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "validate result: $VALIDATE_RESULT"
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::maintenance-ci: validate job failed or was not successful (result=$VALIDATE_RESULT)"
            exit 1
          fi
          echo "maintenance-ci: all mandatory checks successful"
