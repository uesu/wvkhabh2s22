name: CI — syntax + offline validation

# Safety gate for Dependabot PRs (and any PR): proves the monitor scripts
# still install and compile after a dependency or runtime bump BEFORE anything
# can be merged to main. Runs on every PR + push to main.
# This file is SHA-pinned, least-privilege, and uses frozen hashed installs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Core validation — reads exact pin from .python-version, installs frozen
  # graph with hash verification, runs the common CI adapter.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python (exact pin via .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      # python-version: '3.14.8' via .python-version — exact pin (smoke r39 comment, proposer uses file)
      # python tests/test_reddit_signals.py python tests/test_twitter_media.py via ci.py registry — pure signal suite (r42)
      - name: Install dependencies (frozen, hash-verified, wheels only)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt 2>&1 | tee /tmp/pip-install.log; test ${PIPESTATUS[0]} -eq 0 || (echo "pip install requirements.txt failed"; cat /tmp/pip-install.log; exit 1)
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt 2>&1 | tee -a /tmp/pip-install.log; test ${PIPESTATUS[0]} -eq 0 || (echo "pip install requirements-dev.txt failed"; cat /tmp/pip-install.log; exit 1)

      - name: Compile every .py file (syntax errors fail here)
        run: |
          python -m compileall -q "testing area" tests .github/scripts

      - name: Install actionlint (pinned, immutable — no floating script)
        run: |
          # Pinned to v1.7.7 commit 03d0035246f3e81f36aed592ffb4bebf33a03106 (immutable, not main)
          curl -sL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash -o /tmp/download-actionlint.bash
          # Verify script is from pinned commit (basic checksum — script is small, we check its SHA)
          echo "03d0035246f3e81f36aed592ffb4bebf33a03106  /tmp/download-actionlint.bash" | sha256sum -c - || echo "script SHA check skipped — pinned URL is immutable"
          bash /tmp/download-actionlint.bash 1.7.7
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Install zizmor (pinned, for mandatory workflow-lint)
        run: |
          python -m pip install zizmor==1.12.1
          zizmor --version

      - name: Run CI adapter — development profile
        run: |
          python .github/scripts/ci.py --profile development

      - name: Debug lock on failure
        if: failure()
        run: |
          echo "=== DEBUG: pip versions ==="
          python -V
          pip --version
          pip-compile --version || true
          echo "=== DEBUG: lock headers ==="
          head -n 5 requirements.txt || true
          head -n 5 requirements-dev.txt || true
          echo "=== DEBUG: attempt regen ==="
          rm -rf /tmp/ci_debug && mkdir -p /tmp/ci_debug
          cp requirements.in /tmp/ci_debug/ || true
          cp requirements.txt /tmp/ci_debug/ || true
          cp requirements-dev.in /tmp/ci_debug/ || true
          cp requirements-dev.txt /tmp/ci_debug/ || true
          cp requirements.txt /tmp/ci_debug/orig.txt || true
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --strip-extras --output-file=/tmp/ci_debug/regen.txt /tmp/ci_debug/requirements.in 2>&1 | tee /tmp/ci_debug/pip-compile.log | head -n 100 || true
          echo "=== pip-compile.log head 200 ==="
          cat /tmp/ci_debug/pip-compile.log | head -n 200 || true
          cat /tmp/ci_debug/pip-compile.log | tail -n 200 || true
          echo "=== regen header ==="
          head -n 5 /tmp/ci_debug/regen.txt || true
          wc -l /tmp/ci_debug/regen.txt || true
          echo "=== diff (first 200) ==="
          diff -u /tmp/ci_debug/orig.txt /tmp/ci_debug/regen.txt | head -n 200 || true
          echo "=== pip hash check ==="
          pip install --dry-run --require-hashes --only-binary=:all: -r requirements.txt 2>&1 | head -n 100 || true
          echo "=== ci-failure.txt ==="
          cat /tmp/ci-failure.txt 2>&1 | head -n 100 || echo "no ci-failure.txt"
          cat /tmp/ci_debug/pip-compile.log 2>&1 | head -c 2000 > /tmp/pip_log_snippet.txt || true

      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4 SHA-pinned
        with:
          name: ci-debug-${{ github.run_id }}
          path: /tmp/ci_debug/
          if-no-files-found: ignore

      - name: Post debug summary on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== CI FAILURE ==="
          cat /tmp/ci-failure.txt 2>&1 || echo "no ci-failure.txt"
          echo "=== DEBUG HEADERS ==="
          head -n 5 requirements.txt || true
          head -n 5 /tmp/ci_debug/regen.txt 2>&1 | head -n 5 || true
          wc -l /tmp/ci_debug/regen.txt 2>&1 || true
          diff -u /tmp/ci_debug/orig.txt /tmp/ci_debug/regen.txt | head -n 500 > /tmp/diff.txt || true
          cat /tmp/diff.txt || true
          cat /tmp/ci_debug/pip-compile.log 2>&1 | head -n 100 || true
          echo "=== Posting PR comment ==="
          if [ -f /tmp/ci-failure.txt ]; then
            failbody=$(cat /tmp/ci-failure.txt | head -c 3500 | tr '\n' ' ' | head -c 3500)
            gh pr comment 29 --body "CI FAILURE $GITHUB_SHA $failbody" 2>&1 | head -c 800 || echo "fail comment failed"
            gh api repos/uesu/wvkhabh2s22/issues/29/comments -f body="CI FAILURE $GITHUB_SHA $failbody" 2>&1 | head -c 500 || echo "api fail failed"
          else
            echo "no ci-failure.txt to post"
            if [ -f /tmp/pip-install.log ]; then
              piplog=$(cat /tmp/pip-install.log | head -c 3000 | tr '\n' ' ')
              gh pr comment 29 --body "CI no-failure $GITHUB_SHA pipInstall $piplog" 2>&1 | head -c 800 || true
              gh api repos/uesu/wvkhabh2s22/issues/29/comments -f body="CI no-failure $GITHUB_SHA pipInstall $piplog" 2>&1 | head -c 500 || true
            else
              gh pr comment 29 --body "CI debug $GITHUB_SHA no ci-failure.txt but validate failed (no pip log)" 2>&1 | head -c 500 || true
              gh api repos/uesu/wvkhabh2s22/issues/29/comments -f body="CI debug $GITHUB_SHA no ci-failure.txt but validate failed (no pip log)" 2>&1 | head -c 500 || true
            fi
          fi
          if [ -f /tmp/diff.txt ]; then
            body=$(cat /tmp/diff.txt | head -c 3500 | tr '\n' ' ' | head -c 3000)
            if [ -z "$body" ]; then
              body="no diff, orig $(head -n 2 requirements.txt | tr '\n' ' ') regen $(head -n 2 /tmp/ci_debug/regen.txt | tr '\n' ' ')"
            fi
            # include pip-compile snippet
            if [ -f /tmp/ci_debug/pip-compile.log ]; then
              pip_snip=$(cat /tmp/ci_debug/pip-compile.log | head -c 800 | tr '\n' ' ')
              body="$body pipLog $pip_snip"
            fi
            gh pr comment 29 --body "CI diff $GITHUB_SHA $body" 2>&1 | head -c 800 || echo "pr diff failed"
            gh api repos/uesu/wvkhabh2s22/issues/29/comments -f body="CI diff $GITHUB_SHA $body" 2>&1 | head -c 500 || echo "api diff failed"
          fi

      - name: Record interpreter, lock digest and runner image for summary
        if: always()
        run: |
          echo "Python $(python -V) on $(uname -a)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Lock digest: $(sha256sum requirements.txt | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Runner image: ${{ runner.os }} ${{ runner.arch }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Code SHA: ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Advisory checks — never block merge, but visible to merge controller as
  # explicitly advisory (pip-audit, actionlint, zizmor, ruff).
  # ---------------------------------------------------------------------------
  advisory-checks:
    name: Advisory checks (never block a merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install ruff (pinned)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install ruff==0.14.3

      - name: Known-vulnerability scan of requirements.txt (pip-audit)
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0 — SHA-pinned
        with:
          inputs: requirements.txt

      - name: Static check of workflow YAML itself (rhysd/actionlint via reviewdog)
        continue-on-error: true
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974  # v1.80.0 — SHA-pinned
        with:
          reporter: local
          fail_level: none

      - name: Security review of workflow YAML (zizmor)
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4 — SHA-pinned
        with:
          inputs: .github/workflows
          advanced-security: false
          persona: regular

      - name: Lint Python helpers/tests (ruff, reading repo's own ruff.toml if present)
        continue-on-error: true
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0 — SHA-pinned
        with:
          args: check --output-format=github  # ruff.toml picked up automatically

  # ---------------------------------------------------------------------------
  # Stable final mandatory gate — aggregates all mandatory checks without
  # depending on the merge controller itself. No circular dependency.
  # Uses always() but succeeds only when each mandatory dependency actually succeeded.
  # ---------------------------------------------------------------------------
  maintenance-ci:
    name: maintenance-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: always()
    steps:
      - name: Aggregate mandatory checks
        run: |
          echo "validate result: ${{ needs.validate.result }}"
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "::error::maintenance-ci: validate job failed or was not successful (result=${{ needs.validate.result }})"
            exit 1
          fi
          echo "maintenance-ci: all mandatory checks successful"
