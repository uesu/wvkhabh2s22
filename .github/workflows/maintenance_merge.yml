name: Maintenance merge (trusted controller)

# Trusted, review-aware final decision for Dependabot and approved runtime-proposer PRs.
# Trigger reevaluation when trusted CI completes and when PR state/labels/reviews change.
# Verified via API; no polling loop; fail-closed; no PR-head checkout/execution.

on:
  workflow_run:
    workflows: ["CI — syntax + offline validation"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only needed permissions: contents/PR write and checks/statuses/Actions read, no PR-head checkout
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Check out trusted base (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false
          ref: main

      - name: Set up Python (trusted)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install helpers (frozen)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Trusted decision (no-write fixture mode)
        id: decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9 — SHA-pinned
        env:
          AUTO_MERGE_DEPENDABOT: ${{ vars.AUTO_MERGE_DEPENDABOT }}
          AUTO_MERGE_PYTHON_BUMP: ${{ vars.AUTO_MERGE_PYTHON_BUMP }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const trustedRepository = `${owner}/${repo}`;
            // Canonical Actions job link for THIS repository: exact host, exact owner/repo and
            // numeric run/job ids. Anything else is rejected rather than guessed at.
            const canonicalJobLink = (url) => {
              if (typeof url !== 'string') return null;
              const expected = `https://github.com/${trustedRepository}/actions/runs/`;
              const trimmed = url.trim();
              if (!trimmed.startsWith(expected)) return null;
              const match = /^(\d+)\/job\/(\d+)\/?$/.exec(trimmed.slice(expected.length));
              if (!match) return null;
              return { runId: Number.parseInt(match[1], 10), jobId: Number.parseInt(match[2], 10) };
            };

            // Resolve live check runs to the Actions job and workflow run that produced them.
            // The Checks API returns no workflow identity — a real check_runs record carries id,
            // name, head_sha, status, conclusion, app, external_id and html_url, never workflow,
            // workflow_id, path or workflow_run — so provenance has to be fetched and bound.
            //
            // external_id is OPAQUE: for a real Actions check it is a UUID such as
            // 0fb0ae38-2e89-5fc7-8093-e2d0d0cf857d, not the job id, and parseInt on its leading
            // digits would invent a job (83e46dd2-... -> 83). It is passed through as metadata
            // only. The canonical html_url link supplies the run and job ids, and the fetched
            // job's own check_run_url must point back at this exact check in this repository.
            //
            // There is no listWorkflowRunAttempts endpoint. getWorkflowRun reports the run's
            // current attempt and getWorkflowRunAttempt returns that attempt's record, so
            // currency is the agreement of two supported calls.
            //
            // Caches are created per call on purpose: the decision step and the final pre-merge
            // snapshot must each fetch current records, never reuse the earlier snapshot's.
            async function resolveChecks(all, headSha) {
              const jobCache = new Map();
              const runCache = new Map();
              const attemptCache = new Map();
              const resolved = [];
              for (const c of all) {
                const enriched = {
                  id: c.id,
                  name: c.name,
                  status: c.status,
                  conclusion: c.conclusion,
                  head_sha: c.head_sha,
                  external_id: c.external_id,
                  html_url: c.html_url,
                  details_url: c.details_url,
                  app: c.app && c.app.slug ? { slug: c.app.slug } : undefined
                };
                const link = canonicalJobLink(c.html_url) || canonicalJobLink(c.details_url);
                if (!link) {
                  console.log(`Check "${c.name}" has no canonical ${trustedRepository} job link — provenance unresolved`);
                  resolved.push(enriched);
                  continue;
                }
                try {
                  if (!jobCache.has(link.jobId)) {
                    const { data } = await github.rest.actions.getJobForWorkflowRun({ owner, repo, job_id: link.jobId });
                    jobCache.set(link.jobId, data);
                  }
                  enriched.job = jobCache.get(link.jobId);
                } catch (e) {
                  console.log(`Job ${link.jobId} behind check "${c.name}" unavailable: ${e.message} — provenance unresolved`);
                }
                try {
                  if (!runCache.has(link.runId)) {
                    const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: link.runId });
                    runCache.set(link.runId, data);
                  }
                  enriched.run = runCache.get(link.runId);
                } catch (e) {
                  console.log(`Run ${link.runId} behind check "${c.name}" unavailable: ${e.message} — provenance unresolved`);
                }
                if (enriched.run && Number.isInteger(enriched.run.run_attempt)) {
                  const key = `${link.runId}:${enriched.run.run_attempt}`;
                  try {
                    if (!attemptCache.has(key)) {
                      const { data } = await github.rest.actions.getWorkflowRunAttempt({
                        owner, repo, run_id: link.runId, attempt_number: enriched.run.run_attempt
                      });
                      attemptCache.set(key, data);
                    }
                    enriched.attempt = attemptCache.get(key);
                  } catch (e) {
                    console.log(`Attempt ${enriched.run.run_attempt} of run ${link.runId} unavailable: ${e.message} — currency unproven`);
                  }
                }
                resolved.push(enriched);
              }
              // A synthetic gate is never invented: if no real check represents the final gate,
              // the gate is missing and the decision blocks. Legacy commit statuses carry no
              // producing job or run, so they can never satisfy a mandatory check.
              try {
                const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: headSha, per_page: 100 });
                for (const s of statuses) {
                  resolved.push({
                    name: s.context,
                    status: 'completed',
                    conclusion: s.state === 'success' ? 'success' : s.state,
                    head_sha: s.sha || headSha,
                    app: { slug: s.creator && s.creator.login ? s.creator.login : undefined },
                    provenance: 'legacy-commit-status'
                  });
                }
              } catch (e) {
                console.log(`Commit statuses unavailable for ${headSha}: ${e.message}`);
              }
              const provenanced = resolved.filter(c => c.job && c.run && c.attempt).length;
              console.log(`Resolved ${resolved.length} checks for ${headSha}; ${provenanced} carry full job/run/attempt provenance`);
              return resolved;
            }

            // Bind a published proposal to the run and attempt that actually validated and
            // published it. The proposer emits two machine-readable records as bounded notice
            // annotations on its own check runs: one for the validated candidate bytes and one
            // for the publication. Selection is by those identities — the record that names THIS
            // pull request number and THIS head sha — never by first completed run, title, body
            // marker, time proximity or membership of a mutable upstream version list.
            const PROPOSER_WORKFLOW_PATH = '.github/workflows/python_version_bump.yml';
            const PROPOSAL_FILES = ['.python-version', 'requirements.txt',
                                    'requirements-dev.txt', '.github/maintenance.json'];

            function parseNotice(message, kind) {
              if (typeof message !== 'string') return null;
              const prefix = `${kind} `;
              if (!message.startsWith(prefix)) return null;
              try {
                const record = JSON.parse(message.slice(prefix.length).trim());
                return (record && typeof record === 'object' && !Array.isArray(record)) ? record : null;
              } catch (e) {
                return null;
              }
            }

            // The Actions list endpoints return an ENVELOPE — {total_count, jobs: [...]} or
            // {total_count, workflow_runs: [...]} — not a bare array. Octokit's paginate flattens
            // the envelope's list key across every page, but destructuring `data` as the list and
            // iterating it throws a TypeError on the real shape, and the caller's catch would then
            // silently lose every publication record: a fail-open disguised as an error. Both
            // shapes are normalized explicitly and anything malformed stays fail-closed.
            const LIST_KEYS = ['jobs', 'workflow_runs', 'annotations', 'check_runs', 'workflow_run_attempts'];

            function normalizeList(payload) {
              if (Array.isArray(payload)) return payload;
              if (payload && typeof payload === 'object') {
                for (const key of LIST_KEYS) {
                  if (Array.isArray(payload[key])) return payload[key];
                }
              }
              return null;
            }

            // Every notice record published by one proposer run, across ALL pages of its jobs and
            // every annotation of each job's check run. Read-only, and never partial-by-accident:
            // a malformed or unavailable list yields no records, so publication stays unverified.
            async function recordsForRun(runId) {
              const found = { validation: null, publication: null, jobsSeen: 0, listUsable: false };
              let payload;
              try {
                payload = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: runId, per_page: 100
                });
              } catch (e) {
                console.log(`Proposer run ${runId} job list unavailable: ${e.message} — publication unverified`);
                return found;
              }
              const jobs = normalizeList(payload);
              if (!jobs) {
                console.log(`Proposer run ${runId} returned a malformed job list (${payload === null ? 'null' : typeof payload}) — publication unverified`);
                return found;
              }
              found.jobsSeen = jobs.length;
              found.listUsable = true;
              for (const job of jobs) {
                if (!job || !Number.isInteger(job.id)) continue;
                let annotationsPayload;
                try {
                  annotationsPayload = await github.paginate(github.rest.checks.listAnnotations, {
                    owner, repo, check_run_id: job.id, per_page: 100
                  });
                } catch (e) {
                  console.log(`Annotations unavailable for job ${job.id}: ${e.message}`);
                  continue;
                }
                const annotations = normalizeList(annotationsPayload);
                if (!annotations) {
                  console.log(`Annotations for job ${job.id} were malformed — skipping that job`);
                  continue;
                }
                for (const annotation of annotations) {
                  const message = annotation && annotation.message;
                  if (!found.publication) found.publication = parseNotice(message, 'proposal-publication');
                  if (!found.validation) found.validation = parseNotice(message, 'proposal-validation');
                }
                if (found.validation && found.publication) break;
              }
              return found;
            }

            // Digests of the bytes the proposal ACTUALLY publishes at its head, computed here so a
            // proposal can never vouch for itself with its own claimed digests.
            async function proposalDigestsAt(sha) {
              const digests = {};
              for (const path of PROPOSAL_FILES) {
                try {
                  const { data: file } = await github.rest.repos.getContent({
                    owner, repo, path, ref: sha
                  });
                  if (!file || typeof file.content !== 'string') {
                    digests[path] = null;
                    continue;
                  }
                  const bytes = Buffer.from(file.content, 'base64');
                  digests[path] = require('crypto').createHash('sha256').update(bytes).digest('hex');
                } catch (e) {
                  console.log(`Proposal file ${path} unavailable at ${sha}: ${e.message}`);
                  digests[path] = null;
                }
              }
              return digests;
            }

            async function collectPublicationEvidence(pr) {
              const evidence = { repository: trustedRepository };
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: PROPOSER_WORKFLOW_PATH, branch: pr.base.ref, per_page: 100
                });
                const runList = normalizeList(runs);
                if (!runList) {
                  console.log(`Proposer run list was malformed (${runs === null ? 'null' : typeof runs}) — publication unverified`);
                  return evidence;
                }
                const candidates = runList.filter(r =>
                  r && r.path === PROPOSER_WORKFLOW_PATH && r.head_branch === pr.base.ref);
                console.log(`Inspecting ${candidates.length} proposer run(s) on ${pr.base.ref} for a publication record naming PR #${pr.number}`);
                let selected = null;
                for (const run of candidates) {
                  if (!Number.isInteger(run.id)) continue;
                  let records;
                  try {
                    records = await recordsForRun(run.id);
                  } catch (e) {
                    console.log(`Proposer run ${run.id} records unreadable: ${e.message}`);
                    continue;
                  }
                  const publication = records.publication;
                  if (!publication) continue;
                  if (publication.pull_number !== pr.number || publication.published_head !== pr.head.sha) {
                    console.log(`Proposer run ${run.id} published PR #${publication.pull_number} head ${String(publication.published_head || '').slice(0, 12)} — not this proposal`);
                    continue;
                  }
                  selected = { run, records };
                  break;
                }
                if (!selected) {
                  console.log('No proposer run published this exact PR head — publication unverified');
                } else {
                  const { data: proposerRun } = await github.rest.actions.getWorkflowRun({
                    owner, repo, run_id: selected.run.id
                  });
                  evidence.proposer_run = proposerRun;
                  if (Number.isInteger(proposerRun.run_attempt)) {
                    try {
                      const { data: proposerAttempt } = await github.rest.actions.getWorkflowRunAttempt({
                        owner, repo, run_id: proposerRun.id, attempt_number: proposerRun.run_attempt
                      });
                      evidence.proposer_attempt = proposerAttempt;
                    } catch (e) {
                      console.log(`Proposer attempt record unavailable: ${e.message} — publication unverified`);
                    }
                  }
                  evidence.validation_record = selected.records.validation;
                  evidence.publication_record = selected.records.publication;
                  console.log(`Proposer run ${proposerRun.id} attempt ${proposerRun.run_attempt} published this proposal`);
                }
              } catch (e) {
                console.log(`Proposer run lookup failed: ${e.message} — publication unverified`);
              }
              try {
                const { data: publishedCommit } = await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha });
                evidence.published_commit = publishedCommit;
              } catch (e) {
                console.log(`Published proposal commit unavailable: ${e.message} — publication unverified`);
              }
              evidence.proposal_digests = await proposalDigestsAt(pr.head.sha);
              return evidence;
            }

            // Determine PR number: from pull_request_target event or workflow_run head
            let prNumber = context.payload.pull_request?.number;
            let headSha = context.payload.pull_request?.head?.sha;
            if (!prNumber && context.payload.workflow_run) {
              // workflow_run: find PRs for head branch
              const branch = context.payload.workflow_run.head_branch;
              const sha = context.payload.workflow_run.head_sha;
              console.log(`workflow_run for branch ${branch} sha ${sha}`);
              // Search for open PRs with that head
              const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              const match = prs.find(pr => pr.head.sha === sha);
              if (match) {
                prNumber = match.number;
                headSha = sha;
                console.log(`Found PR #${prNumber} for sha ${sha}`);
              } else {
                console.log('No open PR found for this workflow_run head; nothing to decide');
                return;
              }
            }
            if (!prNumber) {
              console.log('No PR context; skipping');
              return;
            }

            // Fetch PR via API (sole source of truth, verify event association through API)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            // Gates: trusted updater identity and expected proposal provenance
            // PRs via BUMP_PAT are authored by token owner, not github-actions[bot]; trust via branch/title pattern, not just author
            const trustedAuthors = ['dependabot[bot]', 'github-actions[bot]'];
            const isPythonBumpBranch = pr.head.ref.startsWith('chore/python-');
            const isPythonBump = isPythonBumpBranch || /bump CPython pin/i.test(pr.title);
            const isDependabot = pr.user?.login === 'dependabot[bot]';
            const isTrustedAuthor = trustedAuthors.includes(pr.user?.login);
            // Same-repository check — fork PRs must not be auto-merged even with matching branch/title
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              console.log(`Head repo ${pr.head.repo.full_name} != ${owner}/${repo} — fork PR, blocking`);
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', `fork PR head ${pr.head.repo.full_name}`);
              return;
            }
            if (pr.base.repo.full_name !== `${owner}/${repo}` || pr.base.ref !== defaultBranch) {
              console.log('Unexpected PR association or target branch; skipping');
              core.setOutput('decision', 'blocked');
              return;
            }
            // Trusted publisher: python bump via BUMP_PAT is allowed when head is same-repo and branch matches, but diff must be strict version/lock-only (validated by helper)
            // Do not trust arbitrary authors with matching branch from forks (already blocked above)
            if (!isTrustedAuthor && !isPythonBumpBranch) {
              console.log(`Author ${pr.user?.login} not trusted and not python bump branch; skipping`);
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', `untrusted author ${pr.user?.login}`);
              return;
            }
            if (!isDependabot && !isPythonBumpBranch && !isTrustedAuthor) {
              console.log(`Unknown PR type (not dependabot/python bump); requiring human review`);
              core.setOutput('decision', 'review-required');
              return;
            }
            // For python bump, require same-repo and strict diff; branch alone is not authorization (helper will enforce version/lock-only diff)
            if (isPythonBumpBranch && pr.head.repo.full_name !== `${owner}/${repo}`) {
              console.log(`Python bump from fork — blocking`);
              core.setOutput('decision', 'blocked');
              return;
            }
            if (pr.state !== 'open' || pr.draft) {
              console.log('PR not open or is draft; skipping');
              core.setOutput('decision', 'blocked');
              return;
            }

            // Hold / changes requested — latest per user, with pagination (fail closed if truncated)
            // Paginate reviews (100 per page) to ensure complete view — fail closed on error or truncation
            let allReviews = [];
            try {
              let page = 1;
              const perPage = 100;
              while (true) {
                const { data } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber, per_page: perPage, page });
                allReviews.push(...data);
                if (data.length < perPage) break;
                page += 1;
                if (page > 10) { // fail closed after 1000 reviews
                  console.log('Too many review pages — fail closed');
                  core.setOutput('decision', 'blocked');
                  core.setOutput('reason', 'reviews pagination limit');
                  return;
                }
              }
            } catch (e) {
              console.log(`Failed to list reviews: ${e.message} — fail closed`);
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'reviews unavailable — fail closed');
              return;
            }
            const reviews = allReviews;
            // Fail closed if reviews is empty but API indicated truncated (we already handle pagination limit above)
            // No fabrication: empty list is valid only if truly no reviews
            // Latest review per user matters (dismissed/approved supersedes prior CHANGES_REQUESTED)
            // COMMENTED must not erase CHANGES_REQUESTED
            const latestByUser = {};
            for (const r of reviews) {
              const user = r.user?.login || 'unknown';
              const state = r.state;
              if (state === 'COMMENTED' || state === 'PENDING') continue;
              latestByUser[user] = r;
            }
            const hasChangesRequested = Object.values(latestByUser).some(r => r.state === 'CHANGES_REQUESTED');
            if (hasChangesRequested) {
              console.log('Changes requested (latest per user); not merging');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'changes requested');
              return;
            }
            // Labels
            const labels = pr.labels.map(l => l.name);
            const holdLabels = ['hold', 'do-not-merge', 'review-required', 'blocked'];
            if (labels.some(l => holdLabels.includes(l))) {
              console.log('Hold label present; not merging');
              core.setOutput('decision', 'blocked');
              return;
            }

            // Structural diff validation: approved version/lock changes only — paginate files
            let allFiles = [];
            {
              let page = 1;
              const perPage = 100;
              while (true) {
                const { data } = await github.rest.pulls.listFiles({ owner, repo, pull_number: prNumber, per_page: perPage, page });
                allFiles.push(...data);
                if (data.length < perPage) break;
                page += 1;
                if (page > 10) {
                  console.log('Too many file pages — fail closed');
                  core.setOutput('decision', 'blocked');
                  return;
                }
              }
            }
            const files = allFiles;
            const changed = files.map(f => f.filename);
            console.log(`Changed files: ${changed.join(', ')} (total ${changed.length})`);
            // Fail closed if pagination indicates truncation (GitHub returns Link header, but we check total)
            // For now, if we got 1000 files, fail closed
            if (changed.length >= 1000) {
              console.log('Too many changed files — fail closed');
              core.setOutput('decision', 'blocked');
              return;
            }
            // Workflow structural change detection: triggers/permissions beyond version pin require review
            for (const f of files) {
              if (f.filename.startsWith('.github/workflows/') && f.status !== 'modified') {
                console.log(`Workflow file added/removed — not routine, needs review`);
                // Do not block outright here; let helper classify as review-required
              }
              if (f.patch && f.filename.includes('workflows')) {
                // If patch modifies on:/permissions: beyond python pin, flag for review
                if (/(^\s*on\s*:|^\s*permissions\s*:)/m.test(f.patch) && !/python-version/.test(f.patch)) {
                  console.log(`Workflow ${f.filename} modifies triggers/permissions — review-required`);
                }
              }
            }

            // Call python helper for diff validation and decision (no PR code execution)
            const { execSync } = require('child_process');
            // Write fixture for python helper (no-write decision mode)
            const fixture = {
              pr: { number: pr.number, state: pr.state, draft: pr.draft, base: pr.base, head: pr.head, user: pr.user, title: pr.title, mergeable: pr.mergeable, mergeable_state: pr.mergeable_state },
              checks: [],
              changed_files: changed,
              labels: labels,
              reviews: reviews,
              head_sha: pr.head.sha,
              repository: `${owner}/${repo}`,
              auto_merge_vars: { AUTO_MERGE_DEPENDABOT: process.env.AUTO_MERGE_DEPENDABOT, AUTO_MERGE_PYTHON_BUMP: process.env.AUTO_MERGE_PYTHON_BUMP },
              review_required: false
            };
            // Enrich checks via API for latest head
            // List checks for the exact head SHA (trusted check identity, not name alone)
            let checks = [];
            try {
              // Checks API with workflow provenance resolution (mandatory for evaluate_checks)
              const perPage = 100;
              let page = 1;
              let all = [];
              try {
                while (true) {
                  const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, filter: 'latest', per_page: perPage, page });
                  if (!Array.isArray(data.check_runs)) break;
                  all.push(...data.check_runs);
                  if (all.length >= data.total_count || data.check_runs.length < perPage) break;
                  page += 1;
                  if (page > 10) {
                    console.log('Too many check pages — fail closed');
                    core.setOutput('decision', 'blocked');
                    core.setOutput('reason', 'checks pagination limit');
                    return;
                  }
                }
              } catch (e) {
                console.log(`Failed to list checks: ${e.message} — fail closed`);
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'checks unavailable — fail closed');
                return;
              }
              checks = await resolveChecks(all, pr.head.sha);
              fixture.repository = trustedRepository;
              fixture.checks = checks;
              console.log(`Checks for ${pr.head.sha}: ${JSON.stringify(checks, null, 2)}`);
            } catch (e) {
              console.log(`Failed to list checks: ${e.message}`);
            }

            // Risk classification: delegate to helper's actual version comparison, not title keyword "major"
            // Build file_patches for workflow content validation and dependency_updates for version classification
            const filePatches = {};
            for (const f of files) {
              if (f.patch) filePatches[f.filename] = f.patch;
            }
            fixture.file_patches = filePatches;
            // Dependency updates: parse from PR body or title if available (helper also parses title)
            fixture.dependency_updates = [];
            // Proposer verification: for python bump, verify workflow run from trusted publisher workflow
            // Publication provenance. Branch, title and body markers are not authorization, and
            // neither is a trusted author identity: the run that published this proposal has to be
            // bound to the published head, its actor and the validated manifest. The helper fails
            // closed on any gap.
            if (isPythonBumpBranch) {
              Object.assign(fixture, await collectPublicationEvidence(pr));
            }
            // Labels already indicate review-required if present
            if (labels.includes('review-required')) {
              fixture.review_required = true;
            }
            // Unset/empty/unknown auto-merge values must not enable merging (fail closed)
            // For dependabot, check author or branch; for python bump, check branch/title + BUMP_PAT pattern
            if (isDependabot && process.env.AUTO_MERGE_DEPENDABOT !== 'yes') {
              console.log('AUTO_MERGE_DEPENDABOT != yes; not merging');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'auto-merge not enabled');
              return;
            }
            if (isPythonBump && process.env.AUTO_MERGE_PYTHON_BUMP !== 'yes') {
              console.log('AUTO_MERGE_PYTHON_BUMP != yes; not merging python bump');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'auto-merge not enabled for python bump');
              return;
            }
            // Helper will classify actual version bumps (e.g., 3.14.5 -> 4.0.0 is major) and workflow/engine changes

            fs.writeFileSync('/tmp/fixture.json', JSON.stringify(fixture, null, 2));
            let helperOutput;
            try {
              helperOutput = execSync('python .github/scripts/maintenance.py --fixture /tmp/fixture.json --policy .github/maintenance.json', { encoding: 'utf-8' });
              console.log(helperOutput);
              const decision = JSON.parse(helperOutput);
              console.log(`Helper decision: ${JSON.stringify(decision)}`);
              core.setOutput('decision', decision.decision);
              core.setOutput('reason', decision.reason);
              core.setOutput('merge', decision.merge ? 'true' : 'false');
              if (!decision.merge) {
                console.log(`Not merging: ${decision.reason}`);
                return;
              }
            } catch (e) {
              console.log(`Helper failed: ${e.message} ${e.stdout || ''}`);
              core.setOutput('decision', 'failed');
              return;
            }

            // Final gates immediately before merge: refresh head and mergeability, verify API says merged
            const { data: finalPr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (finalPr.head.sha !== pr.head.sha) {
              console.log('Head changed during decision; aborting');
              core.setOutput('decision', 'blocked');
              return;
            }
            // Unknown mergeability must defer, not pass — check before clean check
            if (finalPr.mergeable === null || finalPr.mergeable_state === 'unknown' || finalPr.mergeable_state === '' ) {
              console.log('Mergeability unknown; deferring');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'mergeability unknown — defer');
              return;
            }
            if (finalPr.mergeable === false || finalPr.mergeable_state === 'dirty') {
              console.log(`Merge conflict: ${finalPr.mergeable_state}`);
              core.setOutput('decision', 'blocked');
              return;
            }
            if (finalPr.mergeable !== true || finalPr.mergeable_state !== 'clean') {
              console.log(`Not cleanly mergeable: ${finalPr.mergeable_state}`);
              core.setOutput('decision', 'blocked');
              return;
            }

            // Verify checks/reviews/labels still successful for latest head (re-evaluate, not just stale helper result)
            // Re-fetch final reviews and checks for finalPr.head.sha and re-run helper evaluation
            {
              // Re-fetch checks for final head
              let finalChecks = [];
              try {
                let page = 1;
                const perPage = 100;
                let all = [];
                // Fail closed on pagination errors for final re-evaluation
                try {
                  while (true) {
                    const { data } = await github.rest.checks.listForRef({ owner, repo, ref: finalPr.head.sha, filter: 'latest', per_page: perPage, page });
                    if (!Array.isArray(data.check_runs)) break;
                    all.push(...data.check_runs);
                    if (all.length >= data.total_count || data.check_runs.length < perPage) break;
                    page += 1;
                    if (page > 10) {
                      console.log('Too many final check pages — fail closed');
                      core.setOutput('decision', 'blocked');
                      core.setOutput('reason', 'final checks pagination limit');
                      return;
                    }
                  }
                } catch (e) {
                  console.log(`Failed to list final checks: ${e.message} — fail closed`);
                  core.setOutput('decision', 'blocked');
                  core.setOutput('reason', 'final checks unavailable — fail closed');
                  return;
                }
                // The same resolution as the decision step, repeated against the final head so
                // the evidence immediately preceding the merge is real and current.
                finalChecks = await resolveChecks(all, finalPr.head.sha);
              } catch (e) {
                console.log(`Failed to re-list final checks: ${e.message}`);
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'final checks unavailable');
                return;
              }
              // Re-fetch reviews for final PR
              let finalReviews = [];
              try {
                let page = 1;
                while (true) {
                  const { data } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber, per_page: 100, page });
                  finalReviews.push(...data);
                  if (data.length < 100) break;
                  page += 1;
                }
              } catch (e) {
                console.log(`Failed to re-list final reviews: ${e.message}`);
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'final reviews unavailable — fail closed');
                return;
              }
              const finalLabels = finalPr.labels.map(l => l.name);
              const finalHoldLabels = ['hold', 'do-not-merge', 'review-required', 'blocked'];
              if (finalLabels.some(l => finalHoldLabels.includes(l))) {
                console.log('Final refresh: hold label present; aborting');
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'hold label on final refresh');
                return;
              }
              // Check latest review per user
              const finalLatestByUser = {};
              for (const r of finalReviews) {
                const user = r.user?.login || 'unknown';
                const state = r.state;
                if (state === 'COMMENTED' || state === 'PENDING') continue;
                finalLatestByUser[user] = r;
              }
              if (Object.values(finalLatestByUser).some(r => r.state === 'CHANGES_REQUESTED')) {
                console.log('Final refresh: changes requested; aborting');
                core.setOutput('decision', 'blocked');
                return;
              }
              // Re-evaluate via helper with final data (no merge if checks changed)
              const finalFixture = {
                pr: { number: finalPr.number, state: finalPr.state, draft: finalPr.draft, base: finalPr.base, head: finalPr.head, user: finalPr.user, title: finalPr.title, mergeable: finalPr.mergeable, mergeable_state: finalPr.mergeable_state },
                checks: finalChecks,
                changed_files: changed,
                labels: finalLabels,
                reviews: finalReviews,
                head_sha: finalPr.head.sha,
                repository: trustedRepository,
                auto_merge_vars: { AUTO_MERGE_DEPENDABOT: process.env.AUTO_MERGE_DEPENDABOT, AUTO_MERGE_PYTHON_BUMP: process.env.AUTO_MERGE_PYTHON_BUMP },
                review_required: false,
                file_patches: filePatches
              };
              // Re-bind publication against the final head: the published commit is fetched for
              // finalPr.head.sha, so a head that moved after the decision cannot be authorized.
              if (isPythonBumpBranch) {
                Object.assign(finalFixture, await collectPublicationEvidence(finalPr));
              }
              const tmpFinal = '/tmp/fixture_final.json';
              fs.writeFileSync(tmpFinal, JSON.stringify(finalFixture, null, 2));
              try {
                const out = execSync(`python .github/scripts/maintenance.py --fixture ${tmpFinal} --policy .github/maintenance.json`, { encoding: 'utf-8' });
                const dec = JSON.parse(out);
                if (!dec.merge) {
                  console.log(`Final refresh: helper now blocks: ${dec.reason}`);
                  core.setOutput('decision', dec.decision);
                  core.setOutput('reason', dec.reason);
                  return;
                }
              } catch (e) {
                console.log(`Final helper re-evaluation failed: ${e.message}`);
                core.setOutput('decision', 'blocked');
                return;
              }
            }

            // Default to reviewed allowed merge method and verify result; fallback to another enabled method
            const mergeMethods = ['squash', 'merge', 'rebase'];
            let merged = false;
            for (const method of mergeMethods) {
              try {
                const res = await github.rest.pulls.merge({ owner, repo, pull_number: prNumber, merge_method: method, commit_title: `Merge ${pr.title} (#${prNumber})`, sha: finalPr.head.sha });
                if (res.data.merged) {
                  console.log(`Merged #${prNumber} via ${method}`);
                  merged = true;
                  break;
                } else {
                  console.log(`Merge via ${method} reported not merged: ${JSON.stringify(res.data)}`);
                }
              } catch (e) {
                if (e.status === 405 && /not allowed/i.test(e.message)) {
                  console.log(`Merge method ${method} not allowed, trying next`);
                  continue;
                }
                console.log(`Merge failed (${e.status}): ${e.message}`);
                core.setOutput('decision', 'failed');
                return;
              }
            }
            if (!merged) {
              console.log('No merge method enabled in Settings');
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Maintenance merge controller"
            echo "* decision: \`${{ steps.decision.outputs.decision || 'unknown' }}\`"
            echo "* reason: \`${{ steps.decision.outputs.reason || 'n/a' }}\`"
            echo "* merge: \`${{ steps.decision.outputs.merge || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
