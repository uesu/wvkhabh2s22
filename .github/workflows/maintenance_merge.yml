name: Maintenance merge (trusted controller)

# Trusted, review-aware final decision for Dependabot and approved runtime-proposer PRs.
# Trigger reevaluation when trusted CI completes and when PR state/labels/reviews change.
# Verified via API; no polling loop; fail-closed; no PR-head checkout/execution.

on:
  workflow_run:
    workflows: ["CI — syntax + offline validation"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only needed permissions: contents/PR write and checks/statuses/Actions read, no PR-head checkout
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - name: Check out trusted base (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false
          ref: main

      - name: Set up Python (trusted)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install helpers (frozen)
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Trusted decision (no-write fixture mode)
        id: decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9 — SHA-pinned
        env:
          AUTO_MERGE_DEPENDABOT: ${{ vars.AUTO_MERGE_DEPENDABOT }}
          AUTO_MERGE_PYTHON_BUMP: ${{ vars.AUTO_MERGE_PYTHON_BUMP }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Determine PR number: from pull_request_target event or workflow_run head
            let prNumber = context.payload.pull_request?.number;
            let headSha = context.payload.pull_request?.head?.sha;
            if (!prNumber && context.payload.workflow_run) {
              // workflow_run: find PRs for head branch
              const branch = context.payload.workflow_run.head_branch;
              const sha = context.payload.workflow_run.head_sha;
              console.log(`workflow_run for branch ${branch} sha ${sha}`);
              // Search for open PRs with that head
              const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              const match = prs.find(pr => pr.head.sha === sha);
              if (match) {
                prNumber = match.number;
                headSha = sha;
                console.log(`Found PR #${prNumber} for sha ${sha}`);
              } else {
                console.log('No open PR found for this workflow_run head; nothing to decide');
                return;
              }
            }
            if (!prNumber) {
              console.log('No PR context; skipping');
              return;
            }

            // Fetch PR via API (sole source of truth, verify event association through API)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            // Gates: trusted updater identity and expected proposal provenance
            // PRs via BUMP_PAT are authored by token owner, not github-actions[bot]; trust via branch/title pattern, not just author
            const trustedAuthors = ['dependabot[bot]', 'github-actions[bot]'];
            const isPythonBumpBranch = pr.head.ref.startsWith('chore/python-');
            const isPythonBump = isPythonBumpBranch || /bump CPython pin/i.test(pr.title);
            const isDependabot = pr.user?.login === 'dependabot[bot]';
            const isTrustedAuthor = trustedAuthors.includes(pr.user?.login);
            // Allow python bump PRs from BUMP_PAT owner when branch matches chore/python-*
            if (!isTrustedAuthor && !isPythonBumpBranch) {
              console.log(`Author ${pr.user?.login} not trusted and not python bump branch; skipping`);
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', `untrusted author ${pr.user?.login}`);
              return;
            }
            if (!isDependabot && !isPythonBumpBranch && !isTrustedAuthor) {
              console.log(`Unknown PR type (not dependabot/python bump); requiring human review`);
              core.setOutput('decision', 'review-required');
              return;
            }
            if (pr.base.repo.full_name !== `${owner}/${repo}` || pr.base.ref !== defaultBranch) {
              console.log('Unexpected PR association or target branch; skipping');
              core.setOutput('decision', 'blocked');
              return;
            }
            if (pr.state !== 'open' || pr.draft) {
              console.log('PR not open or is draft; skipping');
              core.setOutput('decision', 'blocked');
              return;
            }

            // Hold / changes requested — latest per user, with pagination (fail closed if truncated)
            // Paginate reviews (100 per page) to ensure complete view
            let allReviews = [];
            {
              let page = 1;
              const perPage = 100;
              while (true) {
                const { data } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber, per_page: perPage, page });
                allReviews.push(...data);
                if (data.length < perPage) break;
                page += 1;
                if (page > 10) { // fail closed after 1000 reviews
                  console.log('Too many review pages — fail closed');
                  core.setOutput('decision', 'blocked');
                  core.setOutput('reason', 'reviews pagination limit');
                  return;
                }
              }
            }
            const reviews = allReviews;
            // Latest review per user matters (dismissed/approved supersedes prior CHANGES_REQUESTED)
            const latestByUser = {};
            for (const r of reviews) {
              const user = r.user?.login || 'unknown';
              latestByUser[user] = r;
            }
            const hasChangesRequested = Object.values(latestByUser).some(r => r.state === 'CHANGES_REQUESTED');
            if (hasChangesRequested) {
              console.log('Changes requested (latest per user); not merging');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'changes requested');
              return;
            }
            // Labels
            const labels = pr.labels.map(l => l.name);
            const holdLabels = ['hold', 'do-not-merge', 'review-required', 'blocked'];
            if (labels.some(l => holdLabels.includes(l))) {
              console.log('Hold label present; not merging');
              core.setOutput('decision', 'blocked');
              return;
            }

            // Structural diff validation: approved version/lock changes only — paginate files
            let allFiles = [];
            {
              let page = 1;
              const perPage = 100;
              while (true) {
                const { data } = await github.rest.pulls.listFiles({ owner, repo, pull_number: prNumber, per_page: perPage, page });
                allFiles.push(...data);
                if (data.length < perPage) break;
                page += 1;
                if (page > 10) {
                  console.log('Too many file pages — fail closed');
                  core.setOutput('decision', 'blocked');
                  return;
                }
              }
            }
            const files = allFiles;
            const changed = files.map(f => f.filename);
            console.log(`Changed files: ${changed.join(', ')} (total ${changed.length})`);
            // Fail closed if pagination indicates truncation (GitHub returns Link header, but we check total)
            // For now, if we got 1000 files, fail closed
            if (changed.length >= 1000) {
              console.log('Too many changed files — fail closed');
              core.setOutput('decision', 'blocked');
              return;
            }
            // Workflow structural change detection: triggers/permissions beyond version pin require review
            for (const f of files) {
              if (f.filename.startsWith('.github/workflows/') && f.status !== 'modified') {
                console.log(`Workflow file added/removed — not routine, needs review`);
                // Do not block outright here; let helper classify as review-required
              }
              if (f.patch && f.filename.includes('workflows')) {
                // If patch modifies on:/permissions: beyond python pin, flag for review
                if (/(^\s*on\s*:|^\s*permissions\s*:)/m.test(f.patch) && !/python-version/.test(f.patch)) {
                  console.log(`Workflow ${f.filename} modifies triggers/permissions — review-required`);
                }
              }
            }

            // Call python helper for diff validation and decision (no PR code execution)
            const { execSync } = require('child_process');
            // Write fixture for python helper (no-write decision mode)
            const fixture = {
              pr: { number: pr.number, state: pr.state, draft: pr.draft, base: pr.base, head: pr.head, user: pr.user, title: pr.title, mergeable: pr.mergeable, mergeable_state: pr.mergeable_state },
              checks: [],
              changed_files: changed,
              labels: labels,
              reviews: reviews,
              head_sha: pr.head.sha,
              auto_merge_vars: { AUTO_MERGE_DEPENDABOT: process.env.AUTO_MERGE_DEPENDABOT, AUTO_MERGE_PYTHON_BUMP: process.env.AUTO_MERGE_PYTHON_BUMP },
              review_required: false
            };
            // Enrich checks via API for latest head
            // List checks for the exact head SHA (trusted check identity, not name alone)
            let checks = [];
            try {
              // Checks API
              const perPage = 100;
              let page = 1;
              let all = [];
              while (true) {
                const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, filter: 'latest', per_page: perPage, page });
                if (!Array.isArray(data.check_runs)) break;
                all.push(...data.check_runs);
                if (all.length >= data.total_count || data.check_runs.length < perPage) break;
                page += 1;
              }
              // Also consider commit statuses (legacy)
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
              // Map checks
              checks = all.map(c => ({ name: c.name, status: c.status, conclusion: c.conclusion, app: c.app?.slug }));
              // Add statuses as checks
              for (const s of statuses) {
                checks.push({ name: s.context, status: 'completed', conclusion: s.state === 'success' ? 'success' : s.state });
              }
              fixture.checks = checks;
              console.log(`Checks for ${pr.head.sha}: ${JSON.stringify(checks, null, 2)}`);
            } catch (e) {
              console.log(`Failed to list checks: ${e.message}`);
            }

            // Risk classification: delegate to helper's actual version comparison, not title keyword "major"
            // Build file_patches for workflow content validation and dependency_updates for version classification
            const filePatches = {};
            for (const f of files) {
              if (f.patch) filePatches[f.filename] = f.patch;
            }
            fixture.file_patches = filePatches;
            // Dependency updates: parse from PR body or title if available (helper also parses title)
            fixture.dependency_updates = [];
            // Labels already indicate review-required if present
            if (labels.includes('review-required')) {
              fixture.review_required = true;
            }
            // Unset/empty/unknown auto-merge values must not enable merging (fail closed)
            // For dependabot, check author or branch; for python bump, check branch/title + BUMP_PAT pattern
            if (isDependabot && process.env.AUTO_MERGE_DEPENDABOT !== 'yes') {
              console.log('AUTO_MERGE_DEPENDABOT != yes; not merging');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'auto-merge not enabled');
              return;
            }
            if (isPythonBump && process.env.AUTO_MERGE_PYTHON_BUMP !== 'yes') {
              console.log('AUTO_MERGE_PYTHON_BUMP != yes; not merging python bump');
              core.setOutput('decision', 'blocked');
              core.setOutput('reason', 'auto-merge not enabled for python bump');
              return;
            }
            // Helper will classify actual version bumps (e.g., 3.14.5 -> 4.0.0 is major) and workflow/engine changes

            fs.writeFileSync('/tmp/fixture.json', JSON.stringify(fixture, null, 2));
            let helperOutput;
            try {
              helperOutput = execSync('python .github/scripts/maintenance.py --fixture /tmp/fixture.json --policy .github/maintenance.json', { encoding: 'utf-8' });
              console.log(helperOutput);
              const decision = JSON.parse(helperOutput);
              console.log(`Helper decision: ${JSON.stringify(decision)}`);
              core.setOutput('decision', decision.decision);
              core.setOutput('reason', decision.reason);
              core.setOutput('merge', decision.merge ? 'true' : 'false');
              if (!decision.merge) {
                console.log(`Not merging: ${decision.reason}`);
                return;
              }
            } catch (e) {
              console.log(`Helper failed: ${e.message} ${e.stdout || ''}`);
              core.setOutput('decision', 'failed');
              return;
            }

            // Final gates immediately before merge: refresh head and mergeability, verify API says merged
            const { data: finalPr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (finalPr.head.sha !== pr.head.sha) {
              console.log('Head changed during decision; aborting');
              core.setOutput('decision', 'blocked');
              return;
            }
            if (finalPr.mergeable === false || finalPr.mergeable_state === 'dirty') {
              console.log(`Merge conflict: ${finalPr.mergeable_state}`);
              return;
            }
            if (finalPr.mergeable !== true || finalPr.mergeable_state !== 'clean') {
              console.log(`Not cleanly mergeable: ${finalPr.mergeable_state}`);
              return;
            }
            if (finalPr.mergeable === null || finalPr.mergeable_state === 'unknown') {
              console.log('Mergeability unknown; deferring');
              return;
            }

            // Verify checks/reviews/labels still successful for latest head (re-evaluate, not just stale helper result)
            // Re-fetch final reviews and checks for finalPr.head.sha and re-run helper evaluation
            {
              // Re-fetch checks for final head
              let finalChecks = [];
              try {
                let page = 1;
                const perPage = 100;
                let all = [];
                while (true) {
                  const { data } = await github.rest.checks.listForRef({ owner, repo, ref: finalPr.head.sha, filter: 'latest', per_page: perPage, page });
                  if (!Array.isArray(data.check_runs)) break;
                  all.push(...data.check_runs);
                  if (all.length >= data.total_count || data.check_runs.length < perPage) break;
                  page += 1;
                }
                const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: finalPr.head.sha, per_page: 100 });
                finalChecks = all.map(c => ({ name: c.name, status: c.status, conclusion: c.conclusion, app: c.app?.slug, head_sha: finalPr.head.sha }));
                for (const s of statuses) {
                  finalChecks.push({ name: s.context, status: 'completed', conclusion: s.state === 'success' ? 'success' : s.state, head_sha: finalPr.head.sha });
                }
              } catch (e) {
                console.log(`Failed to re-list final checks: ${e.message}`);
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'final checks unavailable');
                return;
              }
              // Re-fetch reviews for final PR
              let finalReviews = [];
              try {
                let page = 1;
                while (true) {
                  const { data } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber, per_page: 100, page });
                  finalReviews.push(...data);
                  if (data.length < 100) break;
                  page += 1;
                }
              } catch (e) {
                console.log(`Failed to re-list final reviews: ${e.message}`);
              }
              const finalLabels = finalPr.labels.map(l => l.name);
              const finalHoldLabels = ['hold', 'do-not-merge', 'review-required', 'blocked'];
              if (finalLabels.some(l => finalHoldLabels.includes(l))) {
                console.log('Final refresh: hold label present; aborting');
                core.setOutput('decision', 'blocked');
                core.setOutput('reason', 'hold label on final refresh');
                return;
              }
              // Check latest review per user
              const finalLatestByUser = {};
              for (const r of finalReviews) {
                const user = r.user?.login || 'unknown';
                finalLatestByUser[user] = r;
              }
              if (Object.values(finalLatestByUser).some(r => r.state === 'CHANGES_REQUESTED')) {
                console.log('Final refresh: changes requested; aborting');
                core.setOutput('decision', 'blocked');
                return;
              }
              // Re-evaluate via helper with final data (no merge if checks changed)
              const finalFixture = {
                pr: { number: finalPr.number, state: finalPr.state, draft: finalPr.draft, base: finalPr.base, head: finalPr.head, user: finalPr.user, title: finalPr.title, mergeable: finalPr.mergeable, mergeable_state: finalPr.mergeable_state },
                checks: finalChecks,
                changed_files: changed,
                labels: finalLabels,
                reviews: finalReviews,
                head_sha: finalPr.head.sha,
                auto_merge_vars: { AUTO_MERGE_DEPENDABOT: process.env.AUTO_MERGE_DEPENDABOT, AUTO_MERGE_PYTHON_BUMP: process.env.AUTO_MERGE_PYTHON_BUMP },
                review_required: false,
                file_patches: filePatches
              };
              const tmpFinal = '/tmp/fixture_final.json';
              fs.writeFileSync(tmpFinal, JSON.stringify(finalFixture, null, 2));
              try {
                const out = execSync(`python .github/scripts/maintenance.py --fixture ${tmpFinal} --policy .github/maintenance.json`, { encoding: 'utf-8' });
                const dec = JSON.parse(out);
                if (!dec.merge) {
                  console.log(`Final refresh: helper now blocks: ${dec.reason}`);
                  core.setOutput('decision', dec.decision);
                  core.setOutput('reason', dec.reason);
                  return;
                }
              } catch (e) {
                console.log(`Final helper re-evaluation failed: ${e.message}`);
                core.setOutput('decision', 'blocked');
                return;
              }
            }

            // Default to reviewed allowed merge method and verify result; fallback to another enabled method
            const mergeMethods = ['squash', 'merge', 'rebase'];
            let merged = false;
            for (const method of mergeMethods) {
              try {
                const res = await github.rest.pulls.merge({ owner, repo, pull_number: prNumber, merge_method: method, commit_title: `Merge ${pr.title} (#${prNumber})`, sha: finalPr.head.sha });
                if (res.data.merged) {
                  console.log(`Merged #${prNumber} via ${method}`);
                  merged = true;
                  break;
                } else {
                  console.log(`Merge via ${method} reported not merged: ${JSON.stringify(res.data)}`);
                }
              } catch (e) {
                if (e.status === 405 && /not allowed/i.test(e.message)) {
                  console.log(`Merge method ${method} not allowed, trying next`);
                  continue;
                }
                console.log(`Merge failed (${e.status}): ${e.message}`);
                core.setOutput('decision', 'failed');
                return;
              }
            }
            if (!merged) {
              console.log('No merge method enabled in Settings');
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Maintenance merge controller"
            echo "* decision: \`${{ steps.decision.outputs.decision || 'unknown' }}\`"
            echo "* reason: \`${{ steps.decision.outputs.reason || 'n/a' }}\`"
            echo "* merge: \`${{ steps.decision.outputs.merge || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
